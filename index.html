<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Create your assignment repository</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 30rem; margin: 3rem auto; padding: 0 1rem; }
  input, button { font: inherit; padding: .5rem .7rem; }
  input { width: 100%; box-sizing: border-box; margin: .4rem 0 1rem; }
  button { cursor: pointer; }
  .err { color: #b00020; }
  @media (prefers-color-scheme: dark) {
    body { background: #111; color: #eee; }
    .err { color: #ff6b81; }
  }
</style>
</head>
<body>
<h1 id="title">Create your repository</h1>
<form id="form">
  <label for="user">Your GitHub username</label>
  <input id="user" required pattern="\s*[A-Za-z0-9\-]{1,39}\s*" autocomplete="off" autocapitalize="off" spellcheck="false">
  <button>Continue</button>
  <p>You'll be taken to GitHub with the form filled in. Click <b>Submit new issue</b> and your private repository will be created within a minute.</p>
</form>
<p id="error" class="err" hidden></p>

<script>
// Link: https://<org>.github.io/<repo>/#<assignment>.<secret>
const org = location.hostname.split('.')[0];
const repo = location.pathname.split('/')[1];
const [assignment, secret] = location.hash.slice(1).split('.');

// Hex of the first 128 bits of HMAC-SHA256(key, message).
async function hmac(key, message) {
  const enc = new TextEncoder();
  const cryptoKey = await crypto.subtle.importKey('raw', enc.encode(key), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  const bytes = new Uint8Array(await crypto.subtle.sign('HMAC', cryptoKey, enc.encode(message)));
  return Array.from(bytes, (b) => b.toString(16).padStart(2, '0')).join('').slice(0, 32);
}

document.getElementById('title').textContent += ' for ' + assignment;

document.getElementById('form').addEventListener('submit', async (event) => {
  event.preventDefault();
  if (!secret) {
    const error = document.getElementById('error');
    error.textContent = 'This link is incomplete. Please use the full link from your instructor.';
    error.hidden = false;
    return;
  }
  const username = document.getElementById('user').value.trim().toLowerCase();
  const proof = await hmac(secret, assignment + ':' + username);
  // A wrong link just produces a proof that the workflow refuses.
  location.href = `https://github.com/${org}/${repo}/issues/new?template=signup.yml` +
    `&code=${encodeURIComponent(assignment + '.' + proof)}`;
});
</script>
</body>
</html>
