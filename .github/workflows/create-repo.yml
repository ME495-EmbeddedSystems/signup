name: Create student repository

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  create:
    if: github.event.issue.user.type == 'User'
    runs-on: ubuntu-latest
    steps:
      - id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-administration: write
          permission-metadata: read

      # Verifies the request and creates the repo. Sets the `message` output to the reply for the
      # student; if this step throws, the last step posts a generic failure message instead.
      - id: make
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          MASTER_KEY: ${{ secrets.MASTER_KEY }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const crypto = require('crypto');

            const MAX_REPOS = 300;  // per assignment: a safety net in case a link leaks
            const owner = context.repo.owner;
            const login = context.payload.issue.user.login;  // set by GitHub, cannot be forged
            const hmac = (key, message) =>
              crypto.createHmac('sha256', key).update(message).digest('hex').slice(0, 32);
            const refuse = (why, message = 'This link is invalid or has expired. Please ask your instructor for a current link.') => {
              core.info('Refused: ' + why);
              core.setOutput('message', message);
            };

            // The body must be exactly what the issue form produces: "### Code", then "<assignment>.<expiry>.<proof>".
            const match = (context.payload.issue.body || '').trim()
              .match(/^###\s+Code\s+([A-Za-z0-9_-]+)\.(\d{8})\.([0-9a-f]{32})$/);
            if (!match) return refuse('malformed code');
            const [, assignment, expiry, proof] = match;

            // The link secret is derived from the master key, the assignment and its expiry date, so none
            // of them can be changed without invalidating it. The proof binds the secret to this login.
            const secret = hmac(process.env.MASTER_KEY.trim(), `${assignment}:${expiry}`);
            const expected = hmac(secret, login.toLowerCase());
            if (!crypto.timingSafeEqual(Buffer.from(proof), Buffer.from(expected))) {
              return refuse('proof does not match');
            }
            const today = new Date().toISOString().slice(0, 10).replace(/-/g, '');  // UTC, YYYYMMDD
            if (expiry < today) return refuse('link expired');

            const name = `${assignment}-${login}`;
            const url = `https://github.com/${owner}/${name}`;

            // Never reuse an existing repo: that could hand someone else's repo (or a repo like
            // <assignment>-solutions) to whoever registers a matching username.
            const exists = await github.rest.repos.get({ owner, repo: name })
              .then(() => true, (e) => { if (e.status === 404) return false; throw e; });
            if (exists) {
              return refuse('repo already exists',
                `A repository named \`${name}\` already exists. If it is yours, open your invitations: ${url}/invitations\n\n` +
                'Otherwise, please contact your instructor.');
            }

            const repos = await github.paginate(github.rest.repos.listForOrg, { org: owner, per_page: 100 });
            if (repos.filter((r) => r.name.startsWith(assignment + '-')).length >= MAX_REPOS) {
              return refuse('too many repos for this assignment');
            }

            await github.rest.repos.createInOrg({ org: owner, name, private: true });
            await github.rest.repos.addCollaborator({ owner, repo: name, username: login, permission: 'push' });

            core.setOutput('message',
              `@${login} your repository is ready: ${url}\n\n` +
              `Accept the invitation here (if you have not already): ${url}/invitations`);

      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        if: always()
        env:
          MESSAGE: ${{ steps.make.outputs.message }}
        with:
          script: |
            const body = process.env.MESSAGE ||
              'Something went wrong creating your repository. Please open your assignment link again in a minute; if it keeps failing, contact your instructor.';
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            await github.rest.issues.update({ ...context.repo, issue_number: context.issue.number, state: 'closed' });
