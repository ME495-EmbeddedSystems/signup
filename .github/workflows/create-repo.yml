name: Create student repository

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  create:
    if: github.event.issue.user.type == 'User'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-administration: write
          permission-metadata: read

      - id: make
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          MASTER_KEY: ${{ secrets.MASTER_KEY }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const crypto = require('crypto');
            const fs = require('fs');

            const owner = context.repo.owner;
            const login = context.payload.issue.user.login;
            const body = context.payload.issue.body || '';
            // The body must be exactly what the issue form produces, nothing more.
            const m = body.trim().match(/^###\s+Code\s+([A-Za-z0-9_-]+)\.([0-9a-f]{32})$/);
            const assignment = m ? m[1] : '';
            const proof = m ? m[2] : '';
            const hmac = (key, msg) =>
              crypto.createHmac('sha256', key).update(msg).digest('hex').slice(0, 32);
            const refuse = (why, message) => {
              core.info('Refused: ' + why);
              core.setOutput('message', message ||
                'This link is invalid or closed. Please ask your instructor for a current link.');
            };

            const assignments = JSON.parse(fs.readFileSync('assignments.json', 'utf8'));
            const cfg = Object.prototype.hasOwnProperty.call(assignments, assignment)
              ? assignments[assignment] : null;
            if (!cfg || !cfg.open) return refuse('unknown or closed assignment');

            const masterKey = (process.env.MASTER_KEY || '').trim();
            core.info(`assignment=${assignment} nonce=${cfg.nonce} login=${login} master_key_length=${masterKey.length}`);
            const secret = hmac(masterKey, assignment + ':' + cfg.nonce);
            const expected = Buffer.from(hmac(secret, assignment + ':' + login.toLowerCase()));
            const given = Buffer.from(proof);
            if (given.length !== expected.length || !crypto.timingSafeEqual(given, expected)) {
              return refuse('proof does not match');
            }
            core.info('proof verified');

            try {
              const name = cfg.prefix + '-' + login;
              const url = `https://github.com/${owner}/${name}`;

              // Never reuse an existing repo: that could hand someone else's repo (or a repo like
              // <prefix>-solutions) to whoever registers a matching username.
              try {
                await github.rest.repos.get({ owner, repo: name });
                return refuse('repo already exists',
                  `A repository named \`${name}\` already exists. If it is yours, open your invitations: ${url}/invitations\n\n` +
                  'Otherwise, please contact your instructor.');
              } catch (e) {
                if (e.status !== 404) throw e;
              }

              const repos = await github.paginate(github.rest.repos.listForOrg, { org: owner, per_page: 100 });
              const count = repos.filter((r) => r.name.startsWith(cfg.prefix + '-')).length;
              if (count >= cfg.max_repos) return refuse('max_repos reached');

              await github.rest.repos.createInOrg({ org: owner, name, private: true });

              await github.rest.repos.addCollaborator({
                owner, repo: name, username: login, permission: 'push',
              });

              core.setOutput('message',
                `@${login} your repository is ready: ${url}\n\n` +
                `Accept the invitation here (if you have not already): ${url}/invitations`);
            } catch (e) {
              core.setOutput('message', 'Something went wrong creating your repository. Please open your assignment link again in a minute; if it keeps failing, contact your instructor.');
              core.setFailed(e.message);
            }

      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        if: always()
        env:
          MESSAGE: ${{ steps.make.outputs.message }}
        with:
          script: |
            const body = process.env.MESSAGE ||
              'Something went wrong creating your repository. Please open your assignment link again in a minute; if it keeps failing, contact your instructor.';
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            await github.rest.issues.update({ ...context.repo, issue_number: context.issue.number, state: 'closed' });
